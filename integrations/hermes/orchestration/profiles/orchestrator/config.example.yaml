model:
  default: muse-spark-1.3-contributor
  provider: meta-ai
agent:
  reasoning_effort: high
delegation:
  backend: profile_routes
  max_spawn_depth: 2
  orchestrator_enabled: true
  fallback_providers:
    - provider: meta-ai
      model: muse-spark-1.3-contributor
    - provider: deepseek
      model: deepseek-flash
  backends:
    profile_routes:
      profiles:
        - name: architect
          description: Resolves difficult design and migration questions.
        - name: planner
          description: Produces bounded tasks, acceptance criteria, and checks.
        - name: worker
          description: Implements assigned task packets and runs focused checks.
        - name: reviewer
          description: Independently reviews changes and reports findings.
        - name: explorer
          description: Read-only research with concise evidence.
fallback_providers:
  - provider: deepseek
    model: deepseek-flash
